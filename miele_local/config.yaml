name: Miele lokal
version: "0.3.0"
slug: miele_local
description: Lokal styrning av Miele@home-maskiner (MieleRESTServer) med MQTT till HA
url: https://github.com/akappner/MieleRESTServer
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: false
host_network: true
services:
  - mqtt:need
options:
  mode: probe
  host: ""
  name: mrs_potts
  poll_seconds: 30
  debug: false
  group_id: ""
  group_key: ""
schema:
  mode: list(probe|commission|run)
  host: str?
  name: str
  poll_seconds: int(10,600)
  debug: bool
  group_id: str?
  group_key: password?
